<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04060b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Knowledge graph</title>
    <script>
      // Resolve the theme before first paint so there is no flash. Keep in step with web/src/lib/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem("cortex:theme") || "dark";
          var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          // In the desktop app (desktop/main.cjs) the top bar doubles as the window's title bar.
          if (location.search.indexOf("shell=desktop") >= 0) sessionStorage.setItem("cortex:shell", "desktop");
          if (sessionStorage.getItem("cortex:shell") === "desktop") document.documentElement.dataset.shell = "desktop";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
